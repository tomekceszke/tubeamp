# Install with: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]

  # Run from the project environment: mypy needs textual, numpy and the rest
  # installed to resolve anything, so an isolated hook env would have to
  # duplicate the dependency list. Prefers ./.venv, falls back to PATH.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: scripts/run-mypy
        language: script
        types: [python]
        pass_filenames: false

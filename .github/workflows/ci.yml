name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The startup tests boot the real app, which imports python-mpv, so
      # libmpv has to be present here rather than merely nice to have.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y libmpv2 || sudo apt-get install -y libmpv1

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/ tests/

      - name: Test
        run: pytest -q

  # install.sh is the first thing most users run, and it is not covered by ruff
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint the shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck install.sh run.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the distribution
        run: |
          pip install build
          python -m build

      - name: Check the metadata
        run: |
          pip install twine
          twine check dist/*

      # Catch a private file slipping into the archive here, on the pull
      # request, rather than at the tag that would have published it
      - name: Audit the archives
        run: python scripts/audit_sdist.py

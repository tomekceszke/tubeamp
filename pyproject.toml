[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tubeamp"
version = "0.1.0"
description = "A retro-styled TUI music player powered by YouTube"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Tomek Ceszke" },
]
keywords = ["tui", "music-player", "youtube", "visualizer", "retro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = [
    "textual>=1.0.0",
    "python-mpv>=1.0.7",
    "yt-dlp>=2024.0.0",
    "rich>=13.0.0",
    "tomli-w>=1.0.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[project.scripts]
tubeamp = "tubeamp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tubeamp"]
# Ship the stylesheet and the PEP 561 marker alongside the modules
artifacts = ["src/tubeamp/py.typed", "src/tubeamp/styles/*.tcss"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# numpy 2.x ships stubs written with PEP 695 `type` statements. Parsing them
# under the project's 3.11 target aborts the whole run, so skip following them
# rather than raising python_version above what the package claims to support.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

# Neither ships type information
[[tool.mypy.overrides]]
module = ["mpv", "yt_dlp"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
